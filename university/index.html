<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>University Academic Database</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#f3efe6;--card:#fbf8f2;--card2:#f6f1e7;--ink:#1d2b33;--ink2:#56636a;--mute:#8a9196;--line:#e4ddcf;--navy:#1f3a4d;--gold:#b8893b;--good:#2f6b4f;--mid:#9a7a2a;--bad:#9b3d32;--r:14px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif}
.wrap{max-width:1040px;margin:0 auto;padding:28px 16px 60px}
header{display:flex;gap:14px;align-items:center}
.logo{width:46px;height:46px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font:700 15px 'Libre Baskerville',serif;flex:none}
.eyebrow{font-size:11px;letter-spacing:.14em;color:var(--gold);text-transform:uppercase;font-weight:600}
h1{font:700 clamp(24px,4.5vw,32px)/1.15 'Libre Baskerville',serif;margin:2px 0 0}
.lead{color:var(--ink2);max-width:600px;margin:10px 0 22px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:0 4px 14px rgba(60,40,10,.05)}
.stat small{color:var(--ink2);font-size:12px}
.stat b{display:block;font-size:24px;font-weight:600;margin-top:4px}
.controls{display:grid;grid-template-columns:2fr 1.3fr 1.3fr;gap:10px;align-items:end}
label{font-size:12px;color:var(--ink2);display:block;margin-bottom:5px}
input,select{width:100%;font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
button{font:inherit;font-weight:500;cursor:pointer;border-radius:8px;border:1px solid var(--navy);padding:9px 16px;background:var(--navy);color:#fff;white-space:nowrap}
button.ghost{background:transparent;color:var(--navy)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;margin:20px 0 10px}
.tabs{display:flex;gap:18px}
.tab{background:none;border:0;border-bottom:2px solid transparent;border-radius:0;color:var(--ink2);padding:6px 2px}
.tab.on{color:var(--ink);font-weight:600;border-color:var(--gold)}
.toolbar .ghost{padding:6px 12px;font-size:13px}
.hint{font-size:12px;color:var(--mute);margin:-4px 0 10px}
.table{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:auto;box-shadow:0 4px 14px rgba(60,40,10,.05)}
table.list{width:100%;border-collapse:collapse;min-width:760px}
.list th{background:var(--card2);text-align:left;font-weight:600;font-size:13px;padding:11px 14px;border-bottom:1px solid var(--line)}
.list td{padding:11px 14px;border-bottom:1px solid var(--line);font-size:14px}
.list tr:last-child td{border-bottom:0}
.list a{color:var(--ink);font-weight:600;text-decoration:underline;text-decoration-color:#9aa3a8;text-underline-offset:3px;cursor:pointer}
.list a:hover{color:var(--navy);text-decoration-color:var(--gold)}
.g{font-weight:600;font-variant-numeric:tabular-nums}.g.hi{color:var(--good)}.g.md{color:var(--mid)}.g.lo{color:var(--bad)}
.pill{white-space:nowrap;font-size:12px;padding:2px 8px;border-radius:99px;background:#e5efe8;color:var(--good)}
.pill.off{background:#f3e6d4;color:var(--mid)}
.empty{padding:30px;text-align:center;color:var(--mute)}
#transcriptView{display:none;background:#e9e5dc;min-height:100vh;padding:20px 16px 60px}
.tbar{max-width:840px;margin:0 auto 14px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.tbar .nav{display:flex;gap:8px}
.paper{max-width:840px;margin:0 auto;background:#fff;color:#000;padding:44px 52px;box-shadow:0 6px 30px rgba(0,0,0,.15);font:15px/1.35 'Times New Roman',Times,serif}
.thead{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #000;padding-bottom:12px;margin-bottom:16px;gap:12px}
.thead .uni{font-size:20px;font-weight:700;letter-spacing:.02em}
.thead .sub{font-size:13px;letter-spacing:.12em;text-transform:uppercase}
.thead .issued{font-size:16px;font-weight:700;text-align:right;white-space:nowrap}
.thead .issued span{font-weight:400}
.info{display:grid;grid-template-columns:1fr 1fr;gap:2px 24px}
.info div{margin:1px 0}
.paper a{color:#1a0dab}
.paper h4{margin:20px 0 6px;font-size:15px}
.paper h5{margin:14px 0 4px;font-size:15px}
table.tr{width:100%;border-collapse:collapse;font-size:13.5px}
.tr th,.tr td{border:1px solid #000;padding:4px 6px;text-align:center;vertical-align:middle}
.tr th{font-weight:700;padding:8px 6px}
.tr td.title{width:42%}
.tr tr.gpa td{font-weight:700;border-left:0;border-right:0}
.tr tr.gpa td:first-child{border-left:1px solid #000}
.tr tr.gpa td.lab,.tr tr.gpa td.val{border:1px solid #000}
.summary{margin:22px 0 0 22px}
.summary b{display:block;margin-bottom:2px}
.summary u{display:block}
.sign{display:flex;justify-content:space-between;margin-top:46px;gap:24px;font-size:13px}
.sign div{border-top:1px solid #000;padding-top:4px;min-width:200px;text-align:center}
.scale{margin-top:22px;font-size:11.5px;color:#333}
@media (max-width:760px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .controls{grid-template-columns:1fr 1fr}
  .controls .search{grid-column:1/-1}
  .paper{padding:24px 16px}
  .info{grid-template-columns:1fr}
  .tr{font-size:12px}
}
@media print{
  body{background:#fff}
  #dashboard,.tbar{display:none!important}
  #transcriptView{display:block!important;padding:0;background:#fff}
  .paper{box-shadow:none;max-width:none;padding:0}
  table.tr{page-break-inside:avoid}
}
</style>
</head>
<body>

<div id="dashboard" class="wrap">
  <header>
    <div class="logo">UA</div>
    <div><div class="eyebrow">Registrar's Office</div><h1>University Academic Database</h1></div>
  </header>
  <p class="lead">Student names, faculties, course grades, and GPA in one register. Search or click a student to generate their academic transcript automatically.</p>

  <div class="stats">
    <div class="stat"><small>Students</small><b id="stStudents">0</b></div>
    <div class="stat"><small>Course records</small><b id="stRecords">0</b></div>
    <div class="stat"><small>Average cumulative GPA</small><b id="stCum">—</b></div>
    <div class="stat"><small>Average semester GPA</small><b id="stSem">—</b></div>
  </div>

  <div class="controls">
    <div class="search"><label for="q">Search</label><input id="q" placeholder="Name or student ID — press Enter to open transcript" autocomplete="off"></div>
    <div><label for="fFaculty">Faculty</label><select id="fFaculty"></select></div>
    <div><label for="fProgram">Program</label><select id="fProgram"></select></div>
  </div>

  <div class="toolbar">
    <div class="tabs">
      <button class="tab on" data-tab="students">Students</button>
      <button class="tab" data-tab="records">Course records</button>
    </div>
    <button class="ghost" id="exportBtn">Export Excel</button>
  </div>
  <p class="hint" id="hint"></p>
  <div class="table" id="tableWrap"></div>
</div>

<div id="transcriptView">
  <div class="tbar">
    <button class="ghost" id="backBtn">← Back to database</button>
    <div class="nav">
      <button class="ghost" id="prevBtn">‹ Previous</button>
      <button class="ghost" id="nextBtn">Next ›</button>
      <button id="printBtn">Print / Save as PDF</button>
    </div>
  </div>
  <div class="paper" id="paper"></div>
</div>

<script>
const DB = JSON.parse(document.getElementById('db').textContent);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ROMAN = ['I','II','III','IV','V','VI','VII','VIII','IX','X'];
const COURSES = Object.fromEntries(DB.courses.map(c => [c.code, c]));
const POINTS = Object.fromEntries(DB.gradeScale.map(g => [g.letter, g.points]));
let tab = 'students';

const courseOf = code => COURSES[code] || {code, title:'(unknown course)', ects:0};
const termKey = t => { const m = /(spring|fall)\s+(\d{4})/i.exec(t) || []; return (+m[2] || 0) * 10 + (/fall/i.test(m[1] || '') ? 2 : 1); };

function gpa(records) {
  let qp = 0, cr = 0;
  for (const r of records) {
    if (!r.grade || POINTS[r.grade] == null) continue;
    const e = courseOf(r.course_code).ects;
    qp += POINTS[r.grade] * e; cr += e;
  }
  return cr ? Math.round(qp / cr * 100 + 1e-9) / 100 : null;
}

function summary(id) {
  const recs = DB.grades.filter(g => g.student_id === id);
  const terms = [...new Set(recs.map(r => r.term))].sort((a, b) => termKey(a) - termKey(b))
    .map(t => ({term: t, records: recs.filter(r => r.term === t)}));
  const credits = rs => rs.reduce((s, r) => s + courseOf(r.course_code).ects, 0);
  const earned = credits(recs.filter(r => r.grade && r.grade !== 'F'));
  return {terms, semGpa: terms.length ? gpa(terms[terms.length - 1].records) : null, cumGpa: gpa(recs), attempted: credits(recs), earned};
}

const fmt = v => v == null ? '—' : v.toFixed(2);
const cls = v => v == null ? '' : v >= 3.5 ? 'hi' : v >= 3.0 ? 'md' : 'lo';

function fillSelect(sel, values) {
  const cur = sel.value;
  sel.innerHTML = '<option value="">All</option>' + values.map(v => `<option>${esc(v)}</option>`).join('');
  if (values.includes(cur)) sel.value = cur;
}

function updateProgramFilter() {
  const f = $('fFaculty').value;
  fillSelect($('fProgram'), [...new Set(DB.students.filter(s => !f || s.faculty === f).map(s => s.program))].sort());
}

function filtered() {
  const q = $('q').value.trim().toLowerCase(), f = $('fFaculty').value, p = $('fProgram').value;
  return DB.students.filter(s => (!f || s.faculty === f) && (!p || s.program === p) &&
    (!q || s.full_name.toLowerCase().includes(q) || s.student_id.toLowerCase().includes(q)))
    .sort((a, b) => a.full_name.localeCompare(b.full_name));
}

function render() {
  const list = filtered(), ids = new Set(list.map(s => s.student_id));
  const sums = list.map(s => summary(s.student_id));
  const avg = k => { const v = sums.map(x => x[k]).filter(x => x != null); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; };
  $('stStudents').textContent = list.length;
  $('stRecords').textContent = DB.grades.filter(g => ids.has(g.student_id)).length;
  $('stCum').textContent = fmt(avg('cumGpa'));
  $('stSem').textContent = fmt(avg('semGpa'));
  $('hint').textContent = list.length === 1 ? 'One match — press Enter to open the transcript.' : `${list.length} of ${DB.students.length} students shown. Click a name to open the transcript.`;
  const link = s => `<a data-id="${esc(s.student_id)}">${esc(s.full_name)}</a>`;
  let html;
  if (tab === 'students') {
    html = `<table class="list"><thead><tr><th>Student ID</th><th>Student name</th><th>Faculty</th><th>Program</th><th>Status</th><th>Semester GPA</th><th>Cumulative GPA</th></tr></thead><tbody>` +
      list.map((s, i) => `<tr><td>${esc(s.student_id)}</td><td>${link(s)}</td><td>${esc(s.faculty)}</td><td>${esc(s.program)}</td>
        <td><span class="pill ${s.status === 'Active' ? '' : 'off'}">${esc(s.status)}</span></td>
        <td class="g ${cls(sums[i].semGpa)}">${fmt(sums[i].semGpa)}</td><td class="g ${cls(sums[i].cumGpa)}">${fmt(sums[i].cumGpa)}</td></tr>`).join('') + '</tbody></table>';
  } else {
    const byId = Object.fromEntries(list.map(s => [s.student_id, s]));
    const recs = DB.grades.filter(g => ids.has(g.student_id))
      .sort((a, b) => byId[a.student_id].full_name.localeCompare(byId[b.student_id].full_name) || termKey(a.term) - termKey(b.term));
    html = `<table class="list"><thead><tr><th>Student</th><th>Term</th><th>Code</th><th>Course title</th><th>ECTS</th><th>Grade</th><th>Score</th></tr></thead><tbody>` +
      recs.map(r => { const c = courseOf(r.course_code); return `<tr><td>${link(byId[r.student_id])}</td><td>${esc(r.term)}</td><td>${esc(r.course_code)}</td><td>${esc(c.title)}</td><td>${c.ects}</td><td>${esc(r.grade || '—')}</td><td>${r.score ?? '—'}</td></tr>`; }).join('') + '</tbody></table>';
  }
  $('tableWrap').innerHTML = list.length ? html : '<div class="empty">No students match this search.</div>';
}

function today() {
  const d = new Date();
  return `${String(d.getDate()).padStart(2, '0')}.${String(d.getMonth() + 1).padStart(2, '0')}.${d.getFullYear()}`;
}

function transcript(id) {
  const s = DB.students.find(x => x.student_id === id);
  if (!s) return '<p>Student not found.</p>';
  const sum = summary(id);
  const blocks = sum.terms.map(t => {
    const credits = t.records.reduce((a, r) => a + courseOf(r.course_code).ects, 0);
    return `<h5>${esc(t.term)}</h5><table class="tr"><thead><tr><th>Semester</th><th>Course Code</th><th>Course Title</th><th>Grade</th><th>Final<br>Score</th><th>ECTS<br>Credits</th></tr></thead><tbody>` +
      t.records.map(r => { const c = courseOf(r.course_code); return `<tr><td>${esc(r.semester)}</td><td>${esc(r.course_code)}</td><td class="title">${esc(c.title)}</td><td>${esc(r.grade || '—')}</td><td>${r.score ?? '—'}</td><td>${c.ects}</td></tr>`; }).join('') +
      `<tr class="gpa"><td></td><td></td><td></td><td class="lab">GPA</td><td class="val">${fmt(gpa(t.records))}</td><td class="val">${credits}</td></tr></tbody></table>`;
  }).join('');
  const lines = sum.terms.map((t, i) => `<u>${ROMAN[i]} Semester GPA (${esc(t.term)}): ${fmt(gpa(t.records))} / 4.00</u>`).join('');
  const last = ROMAN[sum.terms.length - 1];
  return `
    <div class="thead">
      <div><div class="uni">University Academic Database</div><div class="sub">Registrar's Office · Academic Transcript</div></div>
      <div class="issued">Issued date: <span>${today()}</span></div>
    </div>
    <div class="info">
      <div><b>Student Name:</b> ${esc(s.full_name)}</div>
      <div><b>Student ID:</b> ${esc(s.student_id)}</div>
      <div><b>Faculty:</b> ${esc(s.faculty)}</div>
      <div><b>Program:</b> ${esc(s.program)}</div>
      <div><b>Email:</b> <a href="mailto:${esc(s.email)}">${esc(s.email)}</a></div>
      <div><b>Enrollment Date:</b> ${esc(s.enrollment_date)}</div>
      <div><b>Status:</b> ${esc(s.status)}</div>
    </div>
    <h4>Academic Record</h4>
    ${blocks || '<p>No course records yet.</p>'}
    <div class="summary">
      <b>Cumulative Summary</b>
      <div>Total ECTS Credits Attempted: ${sum.attempted}</div>
      <div>Total ECTS Credits Earned: ${sum.earned}</div>
      ${lines}
      ${last ? `<u>Cumulative GPA after Semester ${last}: ${fmt(sum.cumGpa)} / 4.00</u>` : ''}
    </div>
    <div class="scale">Grading scale: ${DB.gradeScale.map(g => `${g.letter} = ${g.points.toFixed(1)} (${g.min}–${g.max})`).join(' · ')}. GPA = Σ(grade points × ECTS) ÷ Σ ECTS attempted. Credits are earned for grades D and above.</div>
    <div class="sign"><div>Registrar</div><div>Date</div></div>`;
}

let order = [];
function openStudent(id) { location.hash = '#/student/' + encodeURIComponent(id); }

function route() {
  const m = /^#\/student\/(.+)$/.exec(location.hash);
  if (m) {
    const id = decodeURIComponent(m[1]);
    const s = DB.students.find(x => x.student_id === id);
    order = filtered().map(x => x.student_id);
    if (!order.includes(id)) order = DB.students.map(x => x.student_id);
    $('paper').innerHTML = transcript(id);
    document.title = s ? `Transcript — ${s.full_name}` : 'Transcript';
    $('dashboard').style.display = 'none';
    $('transcriptView').style.display = 'block';
    scrollTo(0, 0);
  } else {
    document.title = 'University Academic Database';
    $('transcriptView').style.display = 'none';
    $('dashboard').style.display = 'block';
  }
}

function step(d) {
  const id = decodeURIComponent((/^#\/student\/(.+)$/.exec(location.hash) || [])[1] || '');
  const i = order.indexOf(id);
  if (i >= 0) openStudent(order[(i + d + order.length) % order.length]);
}

function exportExcel() {
  if (!window.XLSX) return alert('The Excel library could not load. Check the internet connection.');
  const wb = XLSX.utils.book_new();
  const add = (name, rows) => XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows), name);
  add('Students', DB.students.map(s => ({'Student ID': s.student_id, 'Full Name': s.full_name, 'University Email': s.email, 'Faculty': s.faculty, 'Program': s.program, 'Level': s.level, 'Enrollment Date': s.enrollment_date, 'Status': s.status})));
  add('Courses', DB.courses.map(c => ({'Course Code': c.code, 'Course Title': c.title, 'ECTS Credits': c.ects})));
  const byId = Object.fromEntries(DB.students.map(s => [s.student_id, s]));
  add('Grades', DB.grades.map(r => { const c = courseOf(r.course_code); return {'Student ID': r.student_id, 'Student Name': byId[r.student_id]?.full_name || '', 'Term': r.term, 'Semester': r.semester, 'Course Code': r.course_code, 'Course Title': c.title, 'ECTS': c.ects, 'Grade': r.grade, 'Final Score': r.score, 'Grade Points': POINTS[r.grade]}; }));
  add('GPA Summary', DB.students.map(s => { const x = summary(s.student_id); const o = {'Student ID': s.student_id, 'Student Name': s.full_name, 'Program': s.program}; x.terms.forEach(t => o[t.term + ' GPA'] = gpa(t.records)); o['Cumulative GPA'] = x.cumGpa; o['ECTS Attempted'] = x.attempted; o['ECTS Earned'] = x.earned; return o; }));
  XLSX.writeFile(wb, 'university_database.xlsx');
}

fillSelect($('fFaculty'), [...new Set(DB.students.map(s => s.faculty))].sort());
updateProgramFilter();
$('q').oninput = render;
$('q').onkeydown = e => { if (e.key === 'Enter') { const l = filtered(); if (l.length) openStudent(l[0].student_id); } };
$('fFaculty').onchange = () => { updateProgramFilter(); render(); };
$('fProgram').onchange = render;
document.querySelectorAll('.tab').forEach(b => b.onclick = () => {
  tab = b.dataset.tab;
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === b));
  render();
});
$('tableWrap').addEventListener('click', e => { const a = e.target.closest('a[data-id]'); if (a) openStudent(a.dataset.id); });
$('backBtn').onclick = () => { location.hash = ''; };
$('prevBtn').onclick = () => step(-1);
$('nextBtn').onclick = () => step(1);
$('printBtn').onclick = () => print();
$('exportBtn').onclick = exportExcel;
addEventListener('hashchange', route);
render();
route();
</script>
